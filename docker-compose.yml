version: "3"

networks:
  cloud-net:
    name: cloud-net

services:
  web-frontend-server1:
    build: ./web-frontend-server
    container_name: web-frontend-server1
    networks:
      - cloud-net
    # Không expose port riêng — truy cập qua api-gateway port 80

  web-frontend-server2:
    build: ./web-frontend-server
    container_name: web-frontend-server2
    networks:
      - cloud-net

  application-backend-server:
    build: ./application-backend-server
    container_name: application-backend-server  
    ports:
      - "8085:8081"
    environment:
      OIDC_INTERNAL: "http://authentication-identity-server:8080"
      OIDC_REALM: "realm_52300263"
      OIDC_AUDIENCE: "account"
    networks:
      - cloud-net

  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-frontend-server1
      - web-frontend-server2
      - application-backend-server
    networks:
    - cloud-net

  relational-database-server:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
    - cloud-net

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false" 
    restart: unless-stopped
    volumes:
      - ./authentication-identity-server/data:/opt/keycloak/data
    ports:
      - "8081:8080"
    networks:
    - cloud-net

  object-storage-server:
    image: minio/minio
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./object-storage-server/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
    - cloud-net

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
    - cloud-net

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports:
      - "3000:3000"
    networks:
    - cloud-net

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    command: ["-g", "-c", "/etc/bind/named.conf"]
    ports:
      - "1053:53/udp"
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      - cloud-net
